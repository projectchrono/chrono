name: chrono
services:
  dev:
    image: "${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}:dev"
    hostname: '${COMPOSE_PROJECT_NAME}'
    container_name: '${COMPOSE_PROJECT_NAME}-dev'
    shm_size: 2g
    ports:
      - "9090:9090" # For RosBridge default port
    build:
      context: "./"
      network: "host"
      dockerfile: "./dev.dockerfile"
      args:
        PROJECT: "${COMPOSE_PROJECT_NAME}"
        IMAGE_BASE: "ubuntu"
        IMAGE_TAG: "26.04"
        USER_GROUPS: "dialout video"
        PIP_REQUIREMENTS: "black"
        APT_DEPENDENCIES: "vim cmake-curses-gui"
        USER_SHELL_ADD_ONS: "alias python=python3"

        CUDA_VERSION: "13-3"
        # Empty builds every architecture this CUDA toolkit knows. The resolved list is baked
        # into the installed ChronoConfig.cmake and forced on downstream projects, so it must
        # cover the GPU that runs the image; pin a compute capability when the toolkit predates
        # the card, e.g. "120" (Blackwell) or "86". A list works ("86;89"). Not "native".
        CHRONO_CUDA_ARCHITECTURES: ""
        ROS_DISTRO: "lyrical"
        OPTIX_SCRIPT: "data/NVIDIA-OptiX-SDK-9.0.0-linux64-x86_64.sh" # Get optix script at https://developer.nvidia.com/designworks/optix/downloads/legacy
    volumes:
      - '../../:/home/${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-dev'
      - '/tmp/.X11-unix:/tmp/.X11-unix'
      # The OptiX denoiser needs the driver's nvoptix.bin. nvidia-container-toolkit mounts it
      # from v1.14.4 / v1.15.0 on; uncomment for older toolkits, and only where the file exists,
      # since Docker materialises a missing bind source as an empty directory.
      # - '/usr/share/nvidia/nvoptix.bin:/usr/share/nvidia/nvoptix.bin:ro'
    environment:
      DISPLAY: '${DISPLAY:-vnc:0.0}'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    working_dir: '/home/${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-dev'
    tty: true
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            count: all
            driver: nvidia
  vnc:
    image: "${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}:vnc"
    hostname: "${COMPOSE_PROJECT_NAME}-vnc"
    container_name: "${COMPOSE_PROJECT_NAME}-vnc"
    build:
      context: "./"
      dockerfile: "./vnc.dockerfile"
      network: "host"
      args:
        VNC_PASSWORD: "${COMPOSE_PROJECT_NAME}"
    ports:
      - "127.0.0.1:8080-8099:8080"
      - "127.0.0.1:5900-5999:5900"
networks:
  default:
    name: "${COMPOSE_PROJECT_NAME}"
