name: chrono
services:
  dev:
    image: "${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}:dev"
    hostname: '${COMPOSE_PROJECT_NAME}'
    container_name: '${COMPOSE_PROJECT_NAME}-dev'
    shm_size: 2g
    ports:
      - "9090:9090" # For RosBridge default port
    build:
      context: "./"
      network: "host"
      dockerfile: "./dev.dockerfile"
      args:
        PROJECT: "${COMPOSE_PROJECT_NAME}"
        # Base, ROS distro and CUDA have to be contemporaries: the all-major architecture list
        # comes from CMake, not from the toolkit, so an older base cannot drive a newer CUDA.
        # Built and verified: 26.04/lyrical/13-3 and 24.04/jazzy/12-9 with the architectures
        # left empty; 24.04/jazzy/13-3 only with them pinned, since CMake 3.28 still emits the
        # sm_60 that CUDA 13 dropped.
        IMAGE_BASE: "ubuntu"
        IMAGE_TAG: "26.04"
        USER_GROUPS: "dialout video"
        PIP_REQUIREMENTS: "black"
        APT_DEPENDENCIES: "vim cmake-curses-gui"
        USER_SHELL_ADD_ONS: "alias python=python3"

        CUDA_VERSION: "13-3"
        # Empty builds every architecture this CUDA toolkit knows. The resolved list is baked
        # into the installed ChronoConfig.cmake and forced on downstream projects, so it must
        # cover the GPU that runs the image; pin a compute capability when the toolkit predates
        # the card, e.g. "120" (Blackwell) or "86". A list works ("86;89"). Not "native".
        CHRONO_CUDA_ARCHITECTURES: ""
        ROS_DISTRO: "lyrical"
        OPTIX_SCRIPT: "data/NVIDIA-OptiX-SDK-9.0.0-linux64-x86_64.sh" # Get optix script at https://developer.nvidia.com/designworks/optix/downloads/legacy
    volumes:
      - '../../:/home/${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-dev'
      - '/tmp/.X11-unix:/tmp/.X11-unix'
      # The OptiX denoiser needs the driver's nvoptix.bin. nvidia-container-toolkit mounts it
      # from v1.14.4 / v1.15.0 on; uncomment for older toolkits, and only where the file exists,
      # since Docker materialises a missing bind source as an empty directory.
      # - '/usr/share/nvidia/nvoptix.bin:/usr/share/nvidia/nvoptix.bin:ro'
    environment:
      DISPLAY: '${DISPLAY:-vnc:0.0}'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    working_dir: '/home/${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-dev'
    tty: true
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            count: all
            driver: nvidia
  # AMD / ROCm counterpart to `dev`, built from dev-amd.dockerfile. It is a separate service
  # rather than a variant of `dev` because the two need different GPU wiring, and because a
  # dockerfile INCLUDE cannot be made conditional.
  dev-amd:
    image: "${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}:dev-amd"
    hostname: '${COMPOSE_PROJECT_NAME}-amd'
    container_name: '${COMPOSE_PROJECT_NAME}-dev-amd'
    shm_size: 2g
    ports:
      - "9092:9090" # RosBridge; host side offset so this can run beside `dev`
    build:
      context: "./"
      network: "host"
      dockerfile: "./dev-amd.dockerfile"
      args:
        PROJECT: "${COMPOSE_PROJECT_NAME}"
        # ROCm comes from the distro, so the base fixes its version: 26.04 gives ROCm 7.1,
        # 24.04 gives 5.7 (Chrono's floor is 5.7.0). Both built and verified.
        IMAGE_BASE: "ubuntu"
        IMAGE_TAG: "26.04"
        USER_GROUPS: "dialout video render"
        PIP_REQUIREMENTS: "black"
        APT_DEPENDENCIES: "vim cmake-curses-gui"
        USER_SHELL_ADD_ONS: "alias python=python3"

        # Unlike CUDA, HIP has no all-major fallback, so this should name the target card:
        # gfx1100 (RX 7900), gfx1030 (RX 6800/6900), gfx90a (MI200), gfx942 (MI300). A list
        # works ("gfx1030;gfx1100") at the cost of build time. Not "native".
        CHRONO_HIP_ARCHITECTURES: "gfx1100"
        ROS_DISTRO: "lyrical"
    volumes:
      - '../../:/home/${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-dev'
      - '/tmp/.X11-unix:/tmp/.X11-unix'
    environment:
      DISPLAY: '${DISPLAY:-vnc:0.0}'
    working_dir: '/home/${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}-dev'
    tty: true
    # ROCm reaches the GPU through the KFD compute device and a render node, so there is no
    # AMD equivalent of the `deploy` reservation above; the devices are passed through
    # directly and the user has to be in the groups that own them.
    devices:
      - '/dev/kfd:/dev/kfd'
      - '/dev/dri:/dev/dri'
    group_add:
      - video
      - render
    security_opt:
      - seccomp:unconfined
  vnc:
    image: "${COMPOSE_PROJECT_NAME}/${COMPOSE_PROJECT_NAME}:vnc"
    hostname: "${COMPOSE_PROJECT_NAME}-vnc"
    container_name: "${COMPOSE_PROJECT_NAME}-vnc"
    build:
      context: "./"
      dockerfile: "./vnc.dockerfile"
      network: "host"
      args:
        VNC_PASSWORD: "${COMPOSE_PROJECT_NAME}"
    ports:
      - "127.0.0.1:8080-8099:8080"
      - "127.0.0.1:5900-5999:5900"
networks:
  default:
    name: "${COMPOSE_PROJECT_NAME}"
