chrono-version: 10.0

# Matches the MBS solver settings of the monolithic RM3 example (demo_FSI-TDPF_rm3_reg_waves), so
# that the two demos differ only in how the two phases are coupled. The HHT parameters not listed
# below are left at their Chrono defaults, as in that demo.
#
# Note that, unlike the monolithic FSI path, the integrator time step below is honored here:
# ChPreciceAdapterMbs advances the multibody system by min(time_step, remaining coupling window).
# Keep it equal to the preCICE time-window-size so that each window is one integration step.

contact_method: NSC

integrator:
  type: HHT
  time_step: 1e-2

solver:
  type: GMRES
  max_iterations: 300
  enable_diagonal_preconditioner: true
