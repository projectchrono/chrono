chrono-version: 10.0

model:
  name: rm3_reg_waves
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "../../.."

  # Two-body hydro data: /body1 is the float, /body2 the reaction plate. The file is referenced in
  # place rather than copied next to this specification, unlike the small sphere used by the
  # sphere_drop example.
  h5_file: fsi-tdpf/rm3/rm3.h5

  # Regular wave of 1 m amplitude and 3 s period, as in demo_FSI-TDPF_rm3_reg_waves. Note that
  # 'height' is the crest-to-trough wave height, i.e. twice the amplitude.
  waves:
    type: regular
    height: 2.0
    period: 3.0
    direction: 0.0  # degrees, 0 = positive x
    phase: 0.0
