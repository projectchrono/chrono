chrono-version: 11.0
type: MBS

model:  "mbs_model.yaml"
solver: "mbs_solver.yaml"

simulation:
  # This value is ignored: a preCICE adapter terminates on the coupling status reported by preCICE alone.
  end_time: -1
  enforce_realtime: false

  # Gravitational acceleration for the solid phase. Must match the gravity of the fluid participant:
  # the two participants are separate processes and nothing reconciles these values for you.
  gravity: [0, 0, -9.81]

  # Frame acceleration (the box oscillates along x): a(t) = A w^2 cos(w t), with A = 0.08 and w = pi (0.5 Hz).
  # Must match the frame acceleration of the other participant.
  frame_acceleration:
    direction: [1, 0, 0]
    function:
      type: SINE
      amplitude: 0.78957
      frequency: 0.5
      phase: 90

output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  type: MODEL_FILE
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Z
    location: [0, -2.5, 0.6]
    target: [0, 0, 0.5]
  output:
    save_images: false
    image_type: "bmp"

precice_adapter_config:
  participant_name: Solid

  # The solid participant runs second in each time window (see precice_config_sph.xml), so it reads the forces
  # produced by the fluid participant in the same window.
  read_data_time: WINDOW_END

  meshes:
  - name: cable

  interfaces:
  - mesh_name: SolidMesh
    mesh_type: FEA_MESH_NODES
    write_data:
    - name: Positions
      type: POSITIONS
    - name: Velocities
      type: LINEAR_VELOCITIES
    - name: Accelerations
      type: LINEAR_ACCELERATIONS
    read_data:
    - name: Forces
      type: FORCES
