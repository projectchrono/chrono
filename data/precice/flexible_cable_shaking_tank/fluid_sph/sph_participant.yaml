chrono-version: 11.0
type: SPH

model:  "sph_model.yaml"
solver: "sph_solver.yaml"

simulation:
  # This value is ignored: a preCICE adapter terminates on the coupling status reported by preCICE alone.
  end_time: -1

  # Gravitational acceleration for the fluid phase. Must match the gravity of the solid participant:
  # the two participants are separate processes and nothing reconciles these values for you.
  gravity: [0, 0, -9.81]

  # Frame acceleration (the box oscillates along x): a(t) = A w^2 cos(w t), with A = 0.08 and w = pi (0.5 Hz).
  # Must match the frame acceleration of the other participant.
  frame_acceleration:
    direction: [1, 0, 0]
    function:
      type: SINE
      amplitude: 0.78957
      frequency: 0.5
      phase: 90

output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Z
    location: [0, -2.5, 0.6]
    target: [0, 0, 0.5]
  output:
    save_images: false
    image_type: "bmp"

  sph_markers: true
  bndry_bce_markers: false
  rigid_bce_markers: false
  flex_bce_markers: true
  active_boxes: false
  color_map:
    type: VELOCITY
    map: JET
    min: 0.0
    max: 0.5
  # Hide markers with y < 0 to reveal the cable (in the y = 0 plane) to a camera looking along +y
  visibility:
    planes:
    - point: [0, 0, 0]
      normal: [0, -1, 0]

precice_adapter_config:
  participant_name: Fluid

  data_path:
    type: RELATIVE
    root: "."

  node_directions: NONE

  # Flexible cable, as seen by the fluid. The node positions must match the initial positions of the cable nodes in
  # the solid participant (here, 8 ANCF cable elements from the top node at [0, 0, 0.8] to the bottom node at
  # [0, 0, 0.005]). Without 'segments', the nodes form a single chain.
  meshes:
  - name: cable
    nodes:
    - [0, 0, 0.8]
    - [0, 0, 0.700625]
    - [0, 0, 0.60125]
    - [0, 0, 0.501875]
    - [0, 0, 0.4025]
    - [0, 0, 0.303125]
    - [0, 0, 0.20375]
    - [0, 0, 0.104375]
    - [0, 0, 0.005]
    bce_pattern_1D: STAR
    remove_center: false
    check_embedded: true

  interfaces:
  - mesh_name: FluidMesh
    mesh_type: FEA_MESH_NODES
    write_data:
    - name: Forces
      type: FORCES
    read_data:
    - name: Positions
      type: POSITIONS
    - name: Velocities
      type: LINEAR_VELOCITIES
    - name: Accelerations
      type: LINEAR_ACCELERATIONS
