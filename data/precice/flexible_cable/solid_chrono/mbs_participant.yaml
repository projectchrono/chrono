chrono-version: 10.0
type: MBS

model:  "mbs_model.yaml"
solver: "mbs_solver.yaml"

simulation:
  # This value is ignored: a preCICE adapter terminates on the coupling status reported by preCICE alone.
  end_time: -1
  enforce_realtime: false

  # Gravitational acceleration for the solid phase. Must match the gravity of the fluid participant:
  # the two participants are separate processes and nothing reconciles these values for you.
  gravity: [0, 0, -9.81]

output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  type: MODEL_FILE
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Z
    location: [0, -4, 1]
    target: [0, 0, 0.5]
  output:
    save_images: false
    image_type: "bmp"

precice_adapter_config:
  participant_name: Solid

  # The solid participant runs second in each time window (see the preCICE configuration files), so it reads
  # the forces produced by the fluid participant in the same window.
  read_data_time: WINDOW_END

  meshes:
  - name: cable

  interfaces:
  - mesh_name: SolidMesh
    mesh_type: FEA_MESH_NODES
    write_data:
    - name: Positions
      type: POSITIONS
    - name: Velocities
      type: LINEAR_VELOCITIES
    - name: Accelerations
      type: LINEAR_ACCELERATIONS
    read_data:
    - name: Forces
      type: FORCES
