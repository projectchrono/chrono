chrono-version: 10.0
type: SPH

model:  "sph_cfd_model.yaml"
solver: "sph_cfd_solver.yaml"

simulation:
  # This value is ignored: a preCICE adapter terminates on the coupling status reported by preCICE alone.
  end_time: -1

  # Gravitational acceleration for the fluid phase. Must match the gravity of the solid participant:
  # the two participants are separate processes and nothing reconciles these values for you.
  gravity: [0, 0, -9.81]

output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Z
    location: [0, -4, 1]
    target: [0, 0, 0.5]
  output:
    save_images: false
    image_type: "bmp"

  sph_markers: true
  bndry_bce_markers: false
  rigid_bce_markers: false
  flex_bce_markers: true
  active_boxes: false
  color_map:
    type: VELOCITY
    map: JET
    min: 0.0
    max: 2.0

precice_adapter_config:
  participant_name: Fluid

  data_path:
    type: RELATIVE
    root: "."

  node_directions: NONE

  # Flexible cable, as seen by the water (CFD) fluid phase. The node positions must match the initial
  # positions of the cable nodes in the solid participant (here, 8 ANCF cable elements from the top node at
  # [-0.3, 0, 0.8] to the bottom node at [-0.3, 0, 0.005]). Without 'segments', the nodes form a single chain.
  meshes:
  - name: cable
    nodes:
    - [-0.3, 0, 0.8]
    - [-0.3, 0, 0.700625]
    - [-0.3, 0, 0.60125]
    - [-0.3, 0, 0.501875]
    - [-0.3, 0, 0.4025]
    - [-0.3, 0, 0.303125]
    - [-0.3, 0, 0.20375]
    - [-0.3, 0, 0.104375]
    - [-0.3, 0, 0.005]
    # Alternatively, read the node positions from a file (same format as body points):
    # nodes: "cable_nodes.txt"
    bce_pattern_1D: STAR
    remove_center: false
    check_embedded: false

  interfaces:
  - mesh_name: FluidMesh
    mesh_type: FEA_MESH_NODES
    write_data:
    - name: Forces
      type: FORCES
    read_data:
    - name: Positions
      type: POSITIONS
    - name: Velocities
      type: LINEAR_VELOCITIES
    - name: Accelerations
      type: LINEAR_ACCELERATIONS
