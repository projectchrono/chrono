chrono-version: 10.0
type: TDPF

# First of two identical TDPF fluid participants. The two differ only in their participant name and in
# the names of their coupling meshes and data (suffix 1 or 2), which must be unique in the preCICE
# configuration. The added mass increment this participant sends (M/6) is set by the demo program.

model:  "tdpf_model.yaml"
solver: "tdpf_solver.yaml"

simulation:
  # Gravitational acceleration for the fluid phase. Must match the gravity of the solid participant:
  # the participants are separate processes and nothing reconciles these values for you.
  gravity: [0, 0, -9.8]

output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  camera:
    vertical: Z
    location: [2, 2, 0.6]
    target: [0, 0, -0.4]

  # TDPF-specific settings (water surface visualization).
  update_fps: 30
  color_map:
    type: HEIGHT
    map: BLUE
    min: -1.5
    max: 1.5

precice_adapter_config:
  participant_name: Fluid1

  bodies:
  - name: ball
    location: [0, 0, 0.18]
    orientation: [0, 0, 0]

  interfaces:
  - mesh_name: FluidMesh1
    mesh_type: RIGID_BODY_REFS
    write_data:
    - name: forces1
      type: FORCES
    - name: torques1
      type: TORQUES
    read_data:
    - name: positions
      type: POSITIONS
    - name: velocities
      type: LINEAR_VELOCITIES
