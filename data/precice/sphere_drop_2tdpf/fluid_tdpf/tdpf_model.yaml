chrono-version: 10.0

model:
  name: sphere_drop
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "."

  # Sphere hydrodynamic data with the fluid density halved (see ../make_sphere_half_rho.py). Each of the
  # two TDPF participants applies half of the hydrodynamic loads of the single TDPF participant in the
  # sphere_drop demo.
  h5_file: sphere_half_rho.h5

  waves:
    type: no_wave
