chrono-version: 10.0

# Matches the MBS solver settings of the Chrono::FSI-TDPF sphere decay example
# (data/yaml/fsi/sphere_decay/mbs_solver.yaml), so that the two demos differ only
# in how the two phases are coupled.
#
# Note that, unlike the monolithic FSI path, the integrator time step below is
# honored here: ChPreciceAdapterMbs advances the multibody system by
# min(time_step, remaining coupling window). Keep it equal to the preCICE
# time-window-size so that each window is one integration step.

contact_method: SMC

integrator:
  type: HHT
  time_step: 1e-3
  rel_tolerance: 1e-4
  abs_tolerance_states: 1e-4
  abs_tolerance_multipliers: 1e2
  max_iterations: 50
  use_stepsize_control: false
  use_modified_newton: false

solver:
  type: GMRES
  max_iterations: 100
  tolerance: 1e-8
  enable_diagonal_preconditioner: false
