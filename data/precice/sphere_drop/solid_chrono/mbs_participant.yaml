chrono-version: 10.0
type: MBS

model:  "mbs_model.yaml"
solver: "mbs_solver.yaml"

simulation:
  # This value is ignored: a preCICE adapter terminates on the coupling status reported by
  # preCICE alone. A negative end time is the Chrono convention for "no end time of my own".
  end_time: -1

  enforce_realtime: true
  
  # Gravitational acceleration for the solid phase. Must match the gravity of the fluid participant:
  # the two participants are separate processes and nothing reconciles these values for you.
  gravity: [0, 0, -9.8]
  
output:
  format: HDF5
  mode: SERIES
  fps: 20

visualization:
  type: PRIMITIVES
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Z
    location: [2, 2, 0.6]
    target: [0, 0, -0.4]
  output:
    save_images: false
    image_type: "bmp"

precice_adapter_config:
  participant_name: Solid

  # Sample the fluid forces at the end of the coupling time window. Valid because this participant
  # is listed as 'second' in the serial coupling scheme and therefore runs after the fluid within
  # each window; the adapter verifies this against the preCICE configuration during initialization.
  read_data_time: WINDOW_END
  
  data_path:
    type: RELATIVE
    root: "../fluid_tdpf"

  bodies:
  - name: ball
  
  added_mass:
    # Infinite-frequency added mass read from the hydro file; the density is taken from the file
    # itself (simulation_parameters/rho), not from the 'density' key below.
    h5_filename: "sphere.h5"
    # Alternative to h5_filename: give the blocks explicitly, non-dimensionalized by 'density'.
    # 'density' is read only on this path. The values below are for a 5 m sphere and do NOT
    # correspond to the 0.12 m sphere used by this demo.
    #density: 1000
    #blocks:
    #- name: ball
    #  data:
    #  - [ 71.57,    0,      0,       0,    143.14, 0       ]
    #  - [  0,      71.57,   0,    -143.14,   0,    0       ]
    #  - [  0,       0,    130.88,    0,      0,    0       ]
    #  - [  0,    -143.14,   0,     286.27,   0,    0       ]
    #  - [143.14,    0,      0,       0,    286.27, 0       ]
    #  - [  0,       0,      0,       0,      0,    6.82e-8 ]

  interfaces:
  - mesh_name: SolidMesh
    mesh_type: RIGID_BODY_REFS
    write_data:
    - name: positions
      type: POSITIONS
    - name: velocities
      type: LINEAR_VELOCITIES
    read_data:
    - name: forces
      type: FORCES
    - name: torques
      type: TORQUES
