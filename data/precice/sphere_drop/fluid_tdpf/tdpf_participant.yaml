chrono-version: 10.0
type: TDPF

model:  "tdpf_model.yaml"
solver: "tdpf_solver.yaml"
  
output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  update_fps: 30
  color_map:
    type: HEIGHT
    map: BLUE
    min: -1.5
    max: 1.5

precice_adapter_config:
  participant_name: Fluid
  
  bodies:
  - name: ball
    location: [0, 0, 0.18]
    orientation: [0, 0, 0]

  interfaces:
  - mesh_name: FluidMesh
    mesh_type: RIGID_BODY_REFS
    write_data:
    - name: forces
      type: FORCES
    - name: torques
      type: TORQUES
    read_data:
    - name: positions
      type: POSITIONS
    - name: velocities
      type: LINEAR_VELOCITIES
