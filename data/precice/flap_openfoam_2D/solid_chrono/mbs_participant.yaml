chrono-version: 10.0
type: MBS

model:  "mbs_model.yaml"
solver: "mbs_solver.yaml"

simulation:
  # This value is ignored: a preCICE adapter terminates on the coupling status reported by
  # preCICE alone. A negative end time is the Chrono convention for "no end time of my own".
  end_time: -1
  # Note that precice_config.xml for this case declares no max-time-windows either, so the
  # simulated duration is bounded only by preCICE's own default limit.

  enforce_realtime: true

  # Gravitational acceleration for the solid phase. Must match the gravity of the fluid participant:
  # the two participants are separate processes and nothing reconciles these values for you.
  # Zero here: gravity is neglected for this channel-flow flap.
  gravity: [0, 0, 0]
  
output:
  format: HDF5
  mode: SERIES
  fps: 20

visualization:
  type: MODEL_FILE
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Y
    location: [0.1, 0, 1]
    target: [0.1, 0, 0]
  output:
    save_images: false
    image_type: "bmp"

precice_adapter_config:
  participant_name: Solid
      
  data_path:
    type: RELATIVE
    root: "."

  bodies:
  - name: flap
    points: flap.txt

  interfaces:
  - mesh_name: SolidMesh
    mesh_type: RIGID_BODY_POINTS
    write_data:
    - name: Displacement
      type: DISPLACEMENTS
    read_data:
    - name: Force
      type: FORCES
