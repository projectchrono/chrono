chrono-version: 10.0
type: FSI

mbs:   "mbs.yaml"
fluid: "tdpf.yaml"

fsi:
  name: FSI_sphere_decay
  angle_degrees: true
  
  data_path:
    type: RELATIVE
    root: "../../.."

  fsi_bodies: 
    - name: body1
      shapes:
        - type: SPHERE
          location: [0, 0, 0]
          radius: 0.12
        
simulation:
  time_step: 1e-3
  end_time: 40
  gravity: [0, 0, -9.8]

visualization:
  render_fps: 100
  enable_shadows: false
  camera:
    vertical: Z
    location: [2, -6, 2]
    target: [0, 0, 0]
  output:
    save_images: false
    image_type: "bmp"
