chrono-version: 10.0

sph:
   free_surface_threshold: 2.4

kernel:
   initial_spacing: 0.01
   d0_multiplier: 1.0

boundary_conditions:
   boundary_method: ADAMI

integration:
   integration_scheme: RK2
   time_step: 2.5e-4

proximity_search:
   num_proximity_search_steps: 1

particle_shifting:
   shifting_method: PPST_XSPH
   shifting_xsph_eps: 0.25
   shifting_ppst_push: 3.0
   shifting_ppst_pull: 1.0

viscosity:
   viscosity_method: ARTIFICIAL_BILATERAL
   artificial_viscosity: 0.5
