chrono-version: 10.0
type: SPH

model:  "sph_cfd_model.yaml"
solver: "sph_cfd_solver.yaml"

simulation:
  end_time: -1

output:
  format: NONE
  mode: FRAMES
  fps: 20

visualization:
  sph_markers: true
  bndry_bce_markers: false
  rigid_bce_markers: false
  flex_bce_markers: true
  active_boxes: false
  color_map:
     type: VELOCITY
     map: JET
     min: 0.0
     max: 2.0
