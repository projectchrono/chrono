chrono-version: 10.0
type: FSI

# Flexible cable anchored at the bottom of a container, impacted by a collapsing granular column (CRM).
# YAML counterpart of demo_FSI-SPH_Flexible_Cable (CRM problem, single cable, no rigid bodies).

mbs:   "mbs.yaml"
fluid: "sph_crm.yaml"

fsi:
  name: CRM flexible cable
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "../../.."

  node_directions: NONE

  fsi_meshes:
    - name: cable
      bce_pattern_1D: STAR
      remove_center: false
      check_embedded: false

simulation:
  time_step: 2.5e-4
  end_time: 10
  gravity: [0, 0, -9.81]

visualization:
  render_fps: 400
  enable_shadows: false
  camera:
    vertical: Z
    location: [0, -4, 1]
    target: [0, 0, 0.5]
  output:
    save_images: false
    image_type: "bmp"
