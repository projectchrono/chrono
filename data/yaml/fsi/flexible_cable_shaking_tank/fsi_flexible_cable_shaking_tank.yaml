chrono-version: 11.0
type: FSI

# Flexible cable anchored at the floor of a box of fluid, periodic in x and y, which oscillates along x.
# The problem is simulated in the frame of the box: the box motion X(t) = A (1 - cos(w t)), with A = 0.08 and a
# frequency of 0.5 Hz, enters as the frame acceleration a(t) = A w^2 cos(w t) along x (the box velocity A w sin(w t)
# has zero mean, so the fluid does not drift relative to the box).

mbs:   "mbs.yaml"
fluid: "sph.yaml"

fsi:
  name: Flexible cable in a shaking tank
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "../../.."

  node_directions: NONE

  fsi_meshes:
    - name: cable
      bce_pattern_1D: STAR
      remove_center: false
      check_embedded: true

simulation:
  time_step: 1e-4
  end_time: 16
  gravity: [0, 0, -9.81]
  # Box acceleration a(t) = A w^2 cos(w t) along x, with A = 0.08 and w = pi (0.5 Hz)
  frame_acceleration:
    direction: [1, 0, 0]
    function:
      type: SINE
      amplitude: 0.78957
      frequency: 0.5
      phase: 90

visualization:
  render_fps: 100
  enable_shadows: false
  camera:
    vertical: Z
    location: [0, -2.5, 0.6]
    target: [0, 0, 0.5]
  output:
    save_images: false
    image_type: "bmp"
