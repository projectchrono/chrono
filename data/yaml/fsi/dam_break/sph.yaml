chrono-version: 10.0
type: SPH

model:  "model_sph.yaml"
solver: "solver_sph.yaml"

simulation:  
  end_time: 100
  
output:
    format: HDF5
    mode: FRAMES
    fps: 20

visualization:
    sph_markers: true
    bndry_bce_markers: true
    rigid_bce_markers: true
    flex_bce_markers: true
    active_boxes: false
    color_map:
       type: VELOCITY
       map: FAST
       min: 0.0
       max: 5.0
       