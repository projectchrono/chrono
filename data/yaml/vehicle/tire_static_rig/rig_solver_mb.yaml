## MBS solver for static tire test rig samples with MB tires (follows mbs_solver.schema)

chrono-version: 10.0

contact_method: SMC               # deformable tires require SMC
effective_curvature_radius: 0.1   # SMC contact stiffness (Chrono default, as in the C++ demos)

integrator:
  type: Euler_implicit_linearized
  time_step: 1e-4                 # multibody and tire step size

solver:
  type: PARDISO                   # requires Chrono::PardisoMKL (MB tire Jacobians are not symmetric: no MINRES)
  lock_sparsity_pattern: true
