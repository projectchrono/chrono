## MBS solver for static tire test rig samples with rigid tires (follows mbs_solver.schema)

chrono-version: 10.0

contact_method: NSC

integrator:
  type: Euler_implicit_linearized
  time_step: 2e-4                 # multibody and tire step size

solver:
  type: Barzilai_Borwein
  max_iterations: 100
  overrelaxation_factor: 0.8
  sharpness_factor: 1.0
