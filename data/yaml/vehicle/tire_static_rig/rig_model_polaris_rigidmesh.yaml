## Static tire test rig model: Polaris wheel with rigid mesh tire

chrono-version: 10.0

model:
  type: VEHICLE
  name: Polaris_RigidMeshTire

  data_path:
    type: RELATIVE
    root: "../../.."

  wheel_json: "vehicle/Polaris/Polaris_Wheel.json"
  tire_json: "vehicle/Polaris/Polaris_RigidMeshTire.json"

  tire:
    collision_type: FOUR_POINTS   # SINGLE_POINT, FOUR_POINTS, ENVELOPE (handling tires only)
    contact_surface:              # deformable tires only
      type: NODE_CLOUD            # NODE_CLOUD, TRIANGLE_MESH
      dimension: 0.02             # contact sphere radius (NODE_CLOUD) or mesh thickness (TRIANGLE_MESH)
      collision_family: 7

rig:
  normal_load: 2900               # Polaris front static wheel load

solver: "rig_solver_rigid.yaml"
