## Static tire test rig model: MB (multibody) tire for the Nokian Hakka Truck Trailer 385/55R22.5 (buffed, as tested)

chrono-version: 10.0

model:
  type: VEHICLE
  name: HMMWV_MBTire_Nokian_Buffed

  data_path:
    type: RELATIVE
    root: "../../.."

  wheel_json: "vehicle/hmmwv/wheel/HMMWV_Wheel.json"
  tire_json: "vehicle/hmmwv/tire/HMMWV_MBTire_Nokian_Buffed.json"

  tire:
    collision_type: FOUR_POINTS   # SINGLE_POINT, FOUR_POINTS, ENVELOPE (handling tires only)
    contact_surface:              # deformable tires only
      type: NODE_CLOUD            # NODE_CLOUD, TRIANGLE_MESH
      dimension: 0.02             # contact sphere radius (NODE_CLOUD) or mesh thickness (TRIANGLE_MESH)
      collision_family: 7

rig:
  normal_load: 44145              # load index 160 (4500 kg)

solver: "rig_solver_mb.yaml"
