## Rig mechanism: Polaris wheel with rigid mesh tire, without suspension

chrono-version: 10.0

model:
  type: VEHICLE                   # VEHICLE, CUSTOM
  name: Polaris_RigidMesh
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "../../.."

  wheel_json: "vehicle/Polaris/Polaris_Wheel.json"
  tire_json: "vehicle/Polaris/Polaris_RigidMeshTire.json"

rig:
  normal_load: 2900               # Polaris front static wheel load
  camber_angle: 0

solver: "rig_solver.yaml"
