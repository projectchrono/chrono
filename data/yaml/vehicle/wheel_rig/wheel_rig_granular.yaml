## Single wheel (no suspension) on granular terrain
## Note: a granular terrain consists of many sphere bodies; practical run times require a Chrono::Multicore system,
## which is not yet supported by the wheel test rig YAML parser.

chrono-version: 10.0
type: WHEEL_RIG

rig: "rig_model_polaris_rigidmesh.yaml"
terrain: "terrain_granular.yaml"

test:
  angle_degrees: true
  mode: TEST                      # SUSPEND, DROP, TEST
  drop_speed: 0.05
  time_delay: 1.0

  longitudinal_speed:
    type: CONSTANT
    value: 0.2
  angular_speed:                  # 10 RPM
    type: CONSTANT
    value: 1.0471975512
  slip_angle:                     # +-5 deg with a 5 s period
    type: SINE
    amplitude: 5
    frequency: 0.2

  ## Steering requires a steerable suspension (see wheel_suspension_rig_rigid.yaml); use slip_angle for a wheel alone
  #steering:
  #  input: ANGLE
  #  function:
  #    type: CONSTANT
  #    value: 0

  ## Constant longitudinal slip (overrides longitudinal_speed and angular_speed)
  #longitudinal_slip:
  #  value: 0.2
  #  base_speed: 0.1

simulation:
  time_step: 2e-4                 # rig step (FSI coupling step with CRM terrain); default: MBS solver step
  end_time: 10                    # negative for infinite end time
  enforce_realtime: false
  gravity: [0, 0, -9.8]           # must be vertical: [0, 0, -g]
  num_threads:
    chrono: 8
    collision: 1
    eigen: 1
    pardiso: 8

output:
  format: ASCII                   # NONE, ASCII, HDF5
  mode: SERIES                    # FRAMES, SERIES
  fps: 100

visualization:
  type: COLLISION                 # MODEL_FILE, PRIMITIVES, COLLISION, NONE
  render_fps: 100
  enable_shadows: true
  camera:
    vertical: Z
    offset: [2.0, 2.5, 1.0]
    target_offset: [0, 0.25, -0.25]
  output:
    save_images: false
    image_type: "bmp"
