## Rig mechanism: HMMWV wheel with MB (multibody) deformable tire, without suspension

chrono-version: 10.0

model:
  type: VEHICLE                   # VEHICLE, CUSTOM
  name: HMMWV_MBTire
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "../../.."

  wheel_json: "vehicle/hmmwv/wheel/HMMWV_Wheel.json"
  tire_json: "vehicle/hmmwv/tire/HMMWV_MBTire.json"

  tire:
    contact_surface:              # deformable tires only
      type: NODE_CLOUD            # NODE_CLOUD, TRIANGLE_MESH
      dimension: 0.02             # contact sphere radius (NODE_CLOUD) or mesh thickness (TRIANGLE_MESH)
      collision_family: 7

rig:
  normal_load: 6500               # HMMWV front static wheel load
  camber_angle: 0

solver: "rig_solver_smc.yaml"
