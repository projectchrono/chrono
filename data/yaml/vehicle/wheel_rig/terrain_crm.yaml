## CRM deformable terrain patch, specified as a Chrono::FSI-SPH simulation (follows fsisph_simulation.schema).
## As a wheel test rig terrain, only the model, solver, and SPH visualization settings are used;
## the simulation and output settings come from the wheel rig simulation file.

chrono-version: 10.0

type: SPH

model: "terrain_crm_model.yaml"
solver: "terrain_crm_solver.yaml"

visualization:
  sph_markers: true
  bndry_bce_markers: true
  rigid_bce_markers: true
  #color_map:
  #  type: HEIGHT                  # NONE, HEIGHT, VELOCITY, DENSITY, PRESSURE
  #  map: BROWN
  #  min: -0.2
  #  max: 0.0
