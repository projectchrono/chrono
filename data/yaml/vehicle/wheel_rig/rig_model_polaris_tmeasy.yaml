## Rig mechanism: Polaris wheel with TMeasy tire, without suspension

chrono-version: 10.0

model:
  type: VEHICLE                   # VEHICLE, CUSTOM
  name: Polaris_TMeasy
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "../../.."

  wheel_json: "vehicle/Polaris/Polaris_Wheel.json"
  tire_json: "vehicle/Polaris/Polaris_TMeasyTire.json"

  tire:
    collision_type: FOUR_POINTS   # SINGLE_POINT, FOUR_POINTS, ENVELOPE

rig:
  normal_load: 2900               # Polaris front static wheel load
  camber_angle: 0

solver: "rig_solver.yaml"
