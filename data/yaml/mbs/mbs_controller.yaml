chrono-version: 11.0
type: MBS

model:  "model_inverted_pendulum_load.yaml"
#model:  "model_inverted_pendulum_motor.yaml"

solver: "solver_nonstiff.yaml"

simulation:
  end_time: 100
  enforce_realtime: true
  
output:
  format: HDF5
  mode: FRAMES
  fps: 20

visualization:
  type: Model_file
  render_fps: 120
  enable_shadows: true
  camera:
    vertical: Z
    location: [9, -4, 1]
    target: [2, 0, 0]
  output:
    save_images: false
    image_type: "bmp"
