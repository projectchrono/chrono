#
# Schema for a Chrono YAML VEHICLE simulation specification file.
# The `chrono-version` must match the Chrono major and minor version numbers.
#
# =============================================================================

required: [chrono-version, type, model, solver]

chrono-version:
  type: string
  description: Chrono version compatible with this YAML specification (M.m or M.m.p)

# -----------------------------------------------------------------------------
# Definitions of common Chrono types

vector3d: &VECTOR3D   # Specification of a ChVector3d
    type: array
    items:
        type: number
    minItems: 3
    maxItems: 3

# -----------------------------------------------------------------------------
# Definition of a Chrono::Vehicle simulation

type:
  description: Type of Chrono simulation (must be VEHICLE)
  type: string
  value: VEHICLE

model:
  description: |
      Vehicle model specification YAML file.
      The path to the model file must be provided relative to the location of this simulation specification file.
      The model file must follow the vehicle_model.schema.
  type: string

solver:
  description: |
      Solver specification YAML file
      The path to the solver file must be provided relative to the location of this simulation specification file.
      The solver file must follow the mbs_solver.schema.
  type: string

simulation:
  description: Simulation settings
  type: object
  properties:
    end_time:
      type: number
      description: |
        Total simulation duration in seconds.
        The simulation will run from t=0 to t=end_time. A negative value indicates an infinite end time.
      minimum: 0
      default: -1
    enforce_realtime:
      type: boolean
      description: Whether to enforce real-time simulation.
      default: false
    gravity:
      type: array
      <<: *VECTOR3D
      description: Gravitational acceleration vector [x, y, z]
      default: [0, 0, -9.8]
    num_threads:
      type: object
      description: |
        Number of threads used by the various parallel components.
        Any entry that is omitted keeps its default value of 1.
      properties:
        chrono:
          type: integer
          description: Number of threads used by Chrono
          minimum: 1
          default: 1
        collision:
          type: integer
          description: Number of threads used by the collision detection system
          minimum: 1
          default: 1
        eigen:
          type: integer
          description: Number of threads used by Eigen
          minimum: 1
          default: 1
        pardiso:
          type: integer
          description: Number of threads used by the PARDISO solver (used only with the PARDISO solver type)
          minimum: 1
          default: 1
    
output:
  description: Output settings
  type: object
  required: [format]
  properties:
     format:
        type: string
        description: Output DB format
        enum: [NONE, ASCII, HDF5]
        default: NONE
     mode:
        type: string
        description: Output mode (one file per output frame, or a single time-series file)
        enum: [FRAMES, SERIES]
        default: FRAMES
     fps:
        type: number
        description: Output frequency (FPS or Hz)
        minimum: 0
        default: 100

visualization:
  description: Visualization settings
  type: object
  properties:
      type:
          type: string
          description: |
            Type of body visualization shapes.
            A value of NONE (the default) also disables run-time visualization altogether.
          enum: [MODEL_FILE, PRIMITIVES, COLLISION, NONE]
          default: NONE
      render_fps:
          type: number
          description: Target frames per second for visualization.
          minimum: 0
          default: 120
      enable_shadows:
          type: boolean
          description: Whether to enable shadows in run-time visualization system
          default: true
      camera:
          type: object
          properties:
              vertical:
                  type: string
                  description: Vertical axis for camera orientation
                  enum: [Y, Z]
                  default: Z
              location:
                  <<: *VECTOR3D
                  description: Initial camera location
                  default: [0, -1, 0]
              target:
                  <<: *VECTOR3D
                  description: Initial camera look-at point
                  default: [0, 0, 0]
      output:
          type: object
          description: Run-time visualization image output
          properties:
              save_images:
                  type: boolean
                  description: Whether to save rendered frames as image files
                  default: false
              image_type:
                  type: string
                  description: Image file type, specified through the file extension
                  default: bmp
  