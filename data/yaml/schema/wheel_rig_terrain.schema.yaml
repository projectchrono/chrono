# =============================================================================
#
# Schema for a YAML Chrono::Vehicle single-wheel test rig terrain specification file (RIGID, SCM, or GRANULAR terrain).
# This is the "terrain" side of a WHEEL_RIG simulation (see wheel_rig_simulation.schema).
# CRM terrain is not specified with this schema, but through a Chrono::FSI-SPH simulation file (fsisph_simulation.schema),
# which references an SPH model file (fsisph_model.schema) and an SPH solver file (fsisph_solver.schema).
# The terrain patch is placed by the rig relative to the wheel.
# The `chrono-version` must match the Chrono major and minor version numbers.
#
# =============================================================================

required: [chrono-version, type, patch]

chrono-version:
  type: string
  description: Chrono version compatible with this YAML specification (M.m or M.m.p)

# -----------------------------------------------------------------------------
# Terrain type and patch

type:
  description: |
    Terrain type.
    Only the parameter object matching the type is read (e.g., `scm` for type SCM); the others are ignored.
  type: string
  enum: [RIGID, SCM, GRANULAR]

patch:
  type: object
  description: Terrain patch dimensions
  required: [length, width]
  properties:
    length:
      type: number
      minimum: 0
    width:
      type: number
      minimum: 0
    depth:
      type: number
      description: Patch depth (used by GRANULAR terrain only)
      minimum: 0
      default: 0

# -----------------------------------------------------------------------------
# Terrain parameters

rigid:
  type: object
  description: Contact material for RIGID terrain
  properties:
    friction:
      type: number
      minimum: 0
      default: 0.8
    restitution:
      type: number
      minimum: 0
      maximum: 1
      default: 0
    Young_modulus:
      type: number
      description: Young's modulus (Pa), used with SMC contact
      minimum: 0
      default: 2e7

scm:
  type: object
  description: Soil parameters for SCM terrain
  properties:
    Bekker_Kphi:
      type: number
      description: Frictional modulus in Bekker model
      default: 2e6
    Bekker_Kc:
      type: number
      description: Cohesive modulus in Bekker model
      default: 0
    Bekker_n:
      type: number
      description: Exponent of sinkage in Bekker model (usually 0.6...1.8)
      default: 1.1
    Mohr_cohesion:
      type: number
      description: Cohesion for shear failure (Pa)
      default: 50
    Mohr_friction:
      type: number
      description: Friction angle for shear failure, always in degrees
      default: 20
    Janosi_shear:
      type: number
      description: Shear parameter J in Janosi-Hanamoto formula (m)
      default: 0.01
    grid_spacing:
      type: number
      description: SCM grid spacing
      minimum: 0
      default: 0.125
    visualize_mesh:
      type: boolean
      description: Whether to create the SCM visualization mesh
      default: true

granular:
  type: object
  description: |
    Particle parameters for GRANULAR terrain.
    A granular terrain consists of many sphere bodies; practical run times require a Chrono::Multicore system, which
    is not yet supported by the wheel test rig YAML parser.
  properties:
    radius:
      type: number
      minimum: 0
      default: 0.02
    density:
      type: number
      minimum: 0
      default: 2000
    friction:
      type: number
      minimum: 0
      default: 0.9
    cohesion:
      type: number
      description: Inter-particle cohesion pressure (Pa)
      minimum: 0
      default: 0
    Young_modulus:
      type: number
      description: Young's modulus (Pa), used with SMC contact
      minimum: 0
      default: 1e7
